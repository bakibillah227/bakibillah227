name: Update contribution activity graph

on:
  schedule:
    - cron: "30 3 * * *"
  push:
    paths:
      - ".github/workflows/activity-graph.yml"
      - "scripts/generate-activity-graph.cjs"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution activity graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GRAPH_USERNAME: ${{ github.repository_owner }}
        run: node scripts/generate-activity-graph.cjs

      - name: Commit contribution activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/activity.svg
          git commit -m "Update contribution activity graph" || exit 0
          git push